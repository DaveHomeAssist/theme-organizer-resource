<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Organizer Resource</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Italiana&family=VT323&family=Cinzel:wght@400;700&family=Exo+2:wght@900&family=Libre+Caslon+Display&family=Poiret+One&family=Major+Mono+Display&family=Fraunces:ital,wght@1,100&family=Oxanium:wght@800&family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Space+Mono&family=Bebas+Neue&family=Libre+Baskerville:ital@1&family=Rajdhani:wght@600&family=Bodoni+Moda:ital,wght@1,400&family=Syncopate:wght@700&family=Spectral:ital,wght@1,300&family=Unbounded:wght@900&family=Anton&family=Josefin+Sans:wght@100;300&family=IM+Fell+English:ital@1&family=Playfair+Display+SC:wght@400&family=Courier+Prime:ital@0;1&family=Permanent+Marker&family=Courier+Prime&display=swap');
  :root{
    --bg:#0c0f14;
    --canvas:#11151d;
    --panel:#171c25;
    --panel-2:#1d2430;
    --soft:#131821;
    --line:#273140;
    --line-strong:#344155;
    --text:#eef3f9;
    --text-2:#b6c1d1;
    --muted:#8c98ab;
    --accent:#8b5cf6;
    --accent-2:#22c55e;
    --warn:#f59e0b;
    --danger:#ef4444;
    --focus:#a78bfa;
    --shadow-soft:0 8px 24px rgba(0,0,0,0.24);
    --shadow-panel:0 16px 36px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  a{color:inherit}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .app{max-width:1560px;margin:0 auto;padding:20px 24px 40px}
  .topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
  .title-wrap h1{margin:0 0 6px;font-size:28px;line-height:1.05}
  .title-wrap p{margin:0;color:var(--text-2);max-width:820px;font-size:14px;line-height:1.5}
  .link-row{display:flex;gap:10px;flex-wrap:wrap}
  .link-btn,.ghost-btn,.primary-btn,.icon-btn{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:12px;
    padding:10px 14px;
    text-decoration:none;
    transition:background .15s,border-color .15s,transform .15s;
  }
  .link-btn:hover,.ghost-btn:hover,.primary-btn:hover,.icon-btn:hover{background:var(--panel-2);border-color:#42506b}
  .primary-btn{background:var(--accent);border-color:transparent}
  .primary-btn:hover{background:#7c3aed}
  .ghost-btn{background:transparent;color:var(--text-2)}
  .toolbar{position:sticky;top:0;z-index:10;background:rgba(12,15,20,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.04);padding:10px 0 14px}
  .toolbar-grid{display:grid;grid-template-columns:2fr repeat(4,minmax(120px,1fr)) auto auto;gap:10px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .field input,.field select,.notes-box{
    min-height:44px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#121823;
    color:var(--text);
    padding:10px 12px;
  }
  .field input::placeholder,.notes-box::placeholder{color:var(--muted)}
  .toolbar-actions{display:flex;gap:10px;align-items:end}
  .toolbar-stack{display:flex;gap:10px;flex-wrap:wrap}
  .toolbar-actions{flex-wrap:wrap;justify-content:flex-end}
  .jump-nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0 14px;
  }
  .jump-nav a{
    display:inline-flex;
    align-items:center;
    min-height:32px;
    padding:0 10px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--text-2);
    text-decoration:none;
    font-size:11px;
    line-height:1;
  }
  .workspace{
    margin:0 0 14px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(23,26,33,0.92);
    overflow:hidden;
  }
  .workspace-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:linear-gradient(180deg,rgba(255,255,255,0.025),rgba(255,255,255,0.01));
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .workspace-header h2{margin:0;font-size:16px}
  .workspace-header p{margin:4px 0 0;color:var(--text-2);font-size:12px}
  .workspace-body{padding:14px}
  .workspace-empty{
    padding:18px;
    border:1px dashed rgba(255,255,255,0.08);
    border-radius:14px;
    color:var(--muted);
    font-size:13px;
  }
  .workspace-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 12px;
    color:var(--text-2);
    font-size:12px;
  }
  .stat strong{color:var(--text)}
  .groups{display:flex;flex-direction:column;gap:14px}
  .group{
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(23,26,33,0.92);
    overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .group-header{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
    padding:14px 16px;
    background:linear-gradient(180deg,rgba(255,255,255,0.025),rgba(255,255,255,0.01));
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .group-header h2{margin:0;font-size:16px}
  .group-header p{margin:4px 0 0;color:var(--text-2);font-size:12px}
  .group-toggle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:36px;
    min-height:36px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--soft);
    color:var(--muted);
    font-size:18px;
    line-height:1;
  }
  .group.collapsed .cards{display:none}
  .group.focus-hidden{display:none}
  .group-count{
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;
    color:var(--muted);
  }
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}
  .card{
    border:1px solid var(--line);
    border-radius:16px;
    background:linear-gradient(180deg,#10151d,#0d1219);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:220px;
    box-shadow:var(--shadow-soft);
    transition:border-color .15s,transform .15s,background .15s;
  }
  .card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .card.active{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px rgba(139,92,246,0.25),var(--shadow-soft)}
  .card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .code{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .name{font-size:17px;font-weight:700;line-height:1.15}
  .desc{font-size:13px;line-height:1.5;color:var(--text-2)}
  .tag-row,.meta-row{display:flex;gap:6px;flex-wrap:wrap}
  .action-row{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }
  .tag,.meta-pill,.status-pill{
    border-radius:999px;
    padding:5px 8px;
    font-size:11px;
    line-height:1;
    border:1px solid var(--line);
  }
  .tag{background:rgba(255,255,255,0.02);color:var(--muted);border-color:rgba(255,255,255,0.06)}
  .meta-pill{background:rgba(139,92,246,0.08);color:#cbbfff;border-color:rgba(139,92,246,0.18)}
  .status-pill.status-unreviewed{background:rgba(255,255,255,0.04);color:var(--muted)}
  .status-pill.status-shortlist{background:rgba(34,197,94,0.14);color:#9bf4b7;border-color:rgba(34,197,94,0.22)}
  .status-pill.status-maybe{background:rgba(245,158,11,0.12);color:#ffd68a;border-color:rgba(245,158,11,0.2)}
  .status-pill.status-archive{background:rgba(239,68,68,0.12);color:#ffb1b1;border-color:rgba(239,68,68,0.2)}
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    font-size:11px;
    color:var(--muted);
  }
  .swatch-chip{
    width:12px;
    height:12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);
    flex:0 0 auto;
  }
  .action-row{margin-top:auto}
  .preview{
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    overflow:hidden;
    background:var(--soft);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .preview-surface{
    padding:12px;
    min-height:132px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .preview-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .preview-brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.88;
  }
  .preview-logo{
    width:16px;
    height:16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.12);
  }
  .preview-chip{
    padding:4px 7px;
    border-radius:999px;
    font-size:10px;
    line-height:1;
    border:1px solid rgba(255,255,255,0.12);
    opacity:.9;
  }
  .preview-title{
    font-size:18px;
    line-height:1;
    font-weight:800;
    letter-spacing:-.03em;
  }
  .preview-body{
    font-size:11px;
    line-height:1.45;
    max-width:26ch;
    opacity:.88;
  }
  .preview-row{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .preview-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:28px;
    padding:0 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    border:1px solid rgba(255,255,255,0.12);
  }
  .preview-card{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.10);
    font-size:10px;
    opacity:.94;
  }
  .preview-large .preview-surface{
    min-height:360px;
    padding:24px;
    gap:16px;
  }
  .preview-large .preview-title{font-size:40px;line-height:.95;letter-spacing:-.04em}
  .preview-large .preview-body{font-size:14px;line-height:1.6;max-width:46ch}
  .preview-large .preview-brand{font-size:11px}
  .preview-large .preview-chip{font-size:11px;padding:5px 9px}
  .preview-large .preview-btn{min-height:34px;padding:0 14px;font-size:12px}
  .preview-large .preview-card{padding:12px 14px;font-size:12px}
  .preview-kicker{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.12em;
    opacity:.78;
    font-weight:700;
  }
  .preview-subtitle{
    font-size:18px;
    line-height:1.15;
    opacity:.94;
    max-width:34ch;
  }
  .preview-copy{
    display:grid;
    gap:8px;
  }
  .preview-copy p{
    margin:0;
    font-size:13px;
    line-height:1.65;
    max-width:48ch;
  }
  .preview-meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .preview-stat{
    padding:8px 10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);
    font-size:11px;
    line-height:1.2;
  }
  .preview-type-specimen{
    display:grid;
    gap:8px;
    padding:14px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(255,255,255,0.05);
  }
  .specimen-xl{
    font-size:32px;
    line-height:0.98;
    letter-spacing:-0.04em;
    font-weight:800;
  }
  .specimen-lg{
    font-size:20px;
    line-height:1.15;
    font-weight:650;
  }
  .specimen-md{
    font-size:14px;
    line-height:1.6;
  }
  .preview-font-note{
    font-size:11px;
    line-height:1.4;
    color:var(--text-2);
  }
  .preview-editor{
    display:grid;
    gap:10px;
  }
  .preview-editor textarea{
    width:100%;
    min-height:72px;
    resize:vertical;
  }
  .preview-editor input,
  .preview-editor textarea{
    background:#121823;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
  }
  .preview-editor-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .preview-tip{
    display:grid;
    gap:10px;
    padding:12px 14px;
    border:1px solid rgba(139,92,246,0.24);
    border-radius:14px;
    background:linear-gradient(180deg,rgba(139,92,246,0.12),rgba(139,92,246,0.05));
  }
  .preview-tip strong{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .preview-tip p{
    margin:0;
    font-size:12px;
    line-height:1.55;
    color:var(--text-2);
  }
  .preview-tip-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .preview-tip-actions button{
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    border-radius:999px;
    padding:8px 10px;
    font-size:11px;
    line-height:1;
  }
  .preview-tip-actions button:last-child{
    color:var(--text-2);
  }
  .preset-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .preset-row button{
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-2);
    border-radius:999px;
    padding:8px 10px;
    font-size:11px;
    line-height:1;
  }
  .preview-copy-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .preview-copy-head strong{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .preview-copy-head span{
    font-size:11px;
    color:var(--muted);
  }
  .action-row button{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:10px;
    padding:10px 10px;
    font-size:12px;
    min-height:40px;
    width:100%;
  }
  .action-row button.secondary{color:var(--muted)}
  .action-row button.shortlisted{background:rgba(34,197,94,0.16);border-color:rgba(34,197,94,0.25);color:#b0ffc8}
  .detail{
    position:sticky;
    top:88px;
    border:1px solid var(--line-strong);
    border-radius:18px;
    background:linear-gradient(180deg,var(--panel),#141923);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:var(--shadow-panel);
  }
  .detail h3{margin:0;font-size:18px}
  .detail p{margin:0;color:var(--text-2);font-size:13px;line-height:1.55}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .detail-wide{grid-column:1 / -1}
  .detail-box{
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    background:rgba(255,255,255,0.015);
    padding:10px;
  }
  .detail-box label{display:block;margin-bottom:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .notes-box{width:100%;min-height:140px;resize:vertical}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
  .mini-list{display:flex;flex-wrap:wrap;gap:6px}
  .footer-note{margin-top:10px;color:var(--muted);font-size:12px}
  .compare{
    margin:0 0 14px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(23,26,33,0.92);
    overflow:hidden;
  }
  .compare[hidden]{display:none}
  .compare-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .compare-header h2{margin:0;font-size:16px}
  .compare-header p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .compare-actions{display:flex;gap:8px;flex-wrap:wrap}
  .compare-grid{
    display:grid;
    grid-template-columns:160px repeat(auto-fit,minmax(180px,1fr));
    gap:0;
    overflow:auto;
    border-top:1px solid rgba(255,255,255,0.04);
  }
  .compare-label,.compare-cell{
    padding:12px;
    border-top:1px solid rgba(255,255,255,0.05);
    border-right:1px solid rgba(255,255,255,0.05);
    min-height:56px;
  }
  .compare-label{
    background:#151b24;
    color:var(--text-2);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .compare-cell{background:rgba(255,255,255,0.01)}
  .compare-theme{
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:flex-start;
  }
  .compare-theme strong{display:block;font-size:14px}
  .compare-theme button{
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    border-radius:10px;
    padding:6px 8px;
    font-size:11px;
  }
  .compare-preview-cell{
    min-width:220px;
  }
  .compare-preview-cell .preview{
    min-width:180px;
  }
  .compare-preview-cell .preview-surface{
    min-height:150px;
  }
  .compare-preview-cell .preview-title{
    font-size:20px;
  }
  .compare-preview-cell .preview-body{
    max-width:28ch;
  }
  .inline-input{
    width:100%;
    min-height:46px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    padding:10px 12px;
  }
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
  .detail-actions .ghost-btn:first-child,
  .action-row button[data-action="select"]{background:var(--panel-2);color:var(--text)}
  .action-row button[data-action="shortlist"],
  #detailShortlist{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.18)}
  .action-row button[data-action="compare"],
  #detailCompare,
  #detailArchive{background:transparent;color:var(--text-2)}
  @media (max-width: 1100px){
    .layout{grid-template-columns:1fr}
    .detail{position:static}
    .toolbar-grid{grid-template-columns:1fr 1fr}
  }
  @media (max-width: 760px){
    .topbar{flex-direction:column}
    .toolbar-grid{grid-template-columns:1fr}
    .detail-grid{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title-wrap">
      <h1>Theme Organizer Resource</h1>
      <p>Companion organizer for the 30-theme gallery. This turns the visual library into a decision tool: search, group, shortlist, annotate, and export a working theme set without overwriting the original theme browser.</p>
    </div>
    <div class="link-row">
      <a class="link-btn" href="./themes_sortable_30.html" target="_blank" rel="noreferrer noopener">Open Original Gallery</a>
      <button id="exportState" class="ghost-btn" type="button">Export Organizer JSON</button>
      <button id="copyShortlist" class="ghost-btn" type="button">Copy Shortlist</button>
      <button id="importState" class="ghost-btn" type="button">Import JSON</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-grid">
      <div class="field">
        <label for="search">Search</label>

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch {
    return {};
  }
}

function persistState() {
  state.ui = {
    groupMode,
    shortlistOnly,
    viewMode,
    previewHintDismissed: !!state.ui.previewHintDismissed
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function buildCollapsedFamilies(expandedThemeId = selectedId) {
  const families = [...new Set(THEME_DATA.map(theme => theme.family))];
  const collapsed = Object.fromEntries(families.map(family => [family, true]));
  const activeTheme = THEME_DATA.find(theme => theme.id === expandedThemeId);
  if (activeTheme) collapsed[activeTheme.family] = false;
  return collapsed;
}

function getRecord(theme) {
  return state[theme.id] || { status:'unreviewed', note:'', project:'', fit:'', selected:false };
}

function setRecord(themeId, patch) {
  state[themeId] = { ...getRecord({ id: themeId }), ...patch };
  state.selectedId = selectedId;
  persistState();
}

function getCompareThemes() {
  return state.compareIds
    .map(id => THEME_DATA.find(theme => theme.id === id))
    .filter(Boolean);
}

function toggleCompare(themeId) {
  const ids = new Set(state.compareIds);
  if (ids.has(themeId)) {
    ids.delete(themeId);
  } else {
    if (ids.size >= 4) {
      const first = state.compareIds[0];
      ids.delete(first);
    }
    ids.add(themeId);
  }
  state.compareIds = [...ids];
  persistState();
}

function uniqueValues(fn) {
  return [...new Set(THEME_DATA.flatMap(fn))].filter(Boolean).sort((a,b) => a.localeCompare(b));

function buildSelect(el, label, values) {
  el.innerHTML = '';
  const base = document.createElement('option');
  base.value = '';
  base.textContent = `All ${label}`;
  el.appendChild(base);
  values.forEach(value => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    el.appendChild(opt);
  });
}

function colorForToken(token) {
  const value = token.toLowerCase();
  const pairs = [
    ['violet', '#7c3aed'],
    ['indigo', '#4338ca'],
    ['cyan', '#22d3ee'],
    ['cream', '#f5e9cf'],
    ['ink black', '#111111'],
    ['black', '#111111'],
    ['sienna', '#b45309'],
    ['yellow', '#facc15'],
    ['forest', '#14532d'],
    ['sage', '#7c9a6d'],
    ['leaf', '#4ade80'],
    ['white', '#f5f5f4'],
    ['gold', '#d4a017'],
    ['green', '#22c55e'],
    ['magenta', '#ec4899'],
    ['blue', '#3b82f6'],
    ['sky', '#60a5fa'],
    ['walnut', '#5b3a29'],
    ['brown', '#7c5a3c'],
    ['crimson', '#dc2626'],
    ['rice paper', '#f4ead3'],
    ['orange', '#f97316'],
    ['pink', '#f472b6'],
    ['periwinkle', '#a5b4fc'],
    ['teal', '#0f766e'],
    ['red', '#ef4444'],
    ['linen', '#ede0c8'],
    ['aubergine', '#4c1d95'],
    ['amber', '#f59e0b'],
    ['grey', '#6b7280'],
    ['gray', '#6b7280'],
    ['jade', '#10b981'],
    ['papaya', '#fb923c'],
    ['ivory', '#f8f4e8'],
    ['vine', '#3f6212'],
    ['conic', '#8b5cf6'],
    ['spectrum', '#ec4899'],
    ['frosted', '#dbeafe'],
    ['steel', '#64748b'],
    ['phosphor', '#84cc16']
  ];
  const match = pairs.find(([needle]) => value.includes(needle));
  if (match) return match[1];
  if (value.includes('dark')) return '#1f2937';
  if (value.includes('light')) return '#e5e7eb';
  if (value.includes('warm')) return '#f59e0b';
  if (value.includes('cold')) return '#38bdf8';
  return '#6b7280';
}

function paletteSwatches(theme) {
  return paletteParts(theme).map(part => `
    <span class="swatch">
      <span class="swatch-chip" style="background:${colorForToken(part)}"></span>
      <span>${part}</span>
    </span>
  `).join('');
}

    body: `${theme.bestFor[0] || 'Flexible system'} interface with ${primaryMood(theme) || 'mixed'} energy and ${primaryColor(theme) || 'neutral'} accent behavior.`
  };
}

function getPreviewCopy(theme) {
  return { ...defaultPreviewCopy(theme), ...(state.previewCopy[theme.id] || {}) };
}

function setPreviewCopy(themeId, patch) {
  state.previewCopy[themeId] = { ...(state.previewCopy[themeId] || defaultPreviewCopy(THEME_DATA.find(theme => theme.id === themeId) || { name:'', description:'', bestFor:[], tags:[] })), ...patch };
  persistState();
}

function resetPreviewCopy(themeId) {
  delete state.previewCopy[themeId];
  persistState();
}

function shouldShowPreviewNudge(theme) {
  if (!theme) return false;
  if (state.ui.previewHintDismissed) return false;
  return !state.previewCopy[theme.id];
}

function previewPreset(theme, record, mode) {
  const project = record.project?.trim() || 'Project';
  if (mode === 'pitch') {
    return {
      headline: `${project} in ${theme.name}`,
      subtitle: `${theme.family} direction tuned for ${theme.bestFor[0] || 'presentation'}`,
      body: `${project} uses the ${theme.name} system to push a ${primaryMood(theme) || 'mixed'} mood with ${primaryColor(theme) || 'neutral'} emphasis and a ${primaryStyle(theme) || 'flexible'} typographic character.`
    };
  }
  if (mode === 'portfolio') {
    return {
      headline: `${project} Case Study`,
      subtitle: `${theme.name} for ${theme.bestFor[0] || 'editorial presentation'}`,
      body: `A presentation-first layout showing how ${project} would read with the ${theme.name} visual language, using the gallery typography and palette cues from this theme.`
    };
  }
  if (mode === 'product') {
    return {
      headline: `${project} Dashboard`,
      subtitle: `${theme.name} for ${theme.bestFor.includes('dashboard') ? 'dashboard UI' : 'product surfaces'}`,
      body: `This preview reframes ${theme.name} as a working product surface so you can judge display weight, supporting copy, and action clarity before committing it to build work.`
    };
  }
  return defaultPreviewCopy(theme);
}

function luminance(hex) {
  const clean = hex.replace('#', '');
  const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
  const rgb = [0, 2, 4].map(i => parseInt(full.slice(i, i + 2), 16) / 255).map(v => (
    v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4
  ));
  return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
}

function pickText(bg) {
  return luminance(bg) > 0.42 ? '#0b1020' : '#f5f7fb';
}

function mix(hexA, hexB, weight = 0.5) {
  const parse = (hex) => {
    const clean = hex.replace('#', '');
    const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
    return [0, 2, 4].map(i => parseInt(full.slice(i, i + 2), 16));
  };
  const [a1, a2, a3] = parse(hexA);
  const [b1, b2, b3] = parse(hexB);
  const mixChannel = (a, b) => Math.round(a + (b - a) * weight).toString(16).padStart(2, '0');
  return `#${mixChannel(a1, b1)}${mixChannel(a2, b2)}${mixChannel(a3, b3)}`;
}

function themeTokens(theme) {
  const parts = paletteParts(theme);
  const colors = parts.length ? parts.map(colorForToken) : ['#1f2937', '#8b5cf6', '#38bdf8'];
  const dark = theme.tags.includes('dark');
  const background = dark ? (colors[0] || '#111827') : mix(colors[0] || '#f5f5f4', '#ffffff', 0.6);
  const surface = dark ? mix(background, '#1f2937', 0.25) : mix(background, '#ffffff', 0.5);
  const accent = colors[1] || colors[0] || '#8b5cf6';
  const accentAlt = colors[2] || colors[1] || accent;
  const text = pickText(background);
  const muted = dark ? mix(text, background, 0.45) : mix(text, background, 0.58);
  const border = dark ? mix(background, '#ffffff', 0.18) : mix(background, '#111827', 0.12);
  const radius = theme.tags.includes('brutalist') ? '6px' : theme.tags.includes('luxury') ? '18px' : '12px';
  const gradient = theme.tags.includes('maximal') || theme.tags.includes('neon')
    ? `linear-gradient(135deg, ${background}, ${mix(accent, accentAlt, 0.45)})`
    : background;
  const type = typeProfile(theme);
  return { background, surface, accent, accentAlt, text, muted, border, radius, gradient, ...type };
}

function sortThemes(themes) {
  const sortBy = sortByEl.value;
  return [...themes].sort((a,b) => {
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    if (sortBy === 'mood') return primaryMood(a).localeCompare(primaryMood(b)) || a.name.localeCompare(b.name);
    if (sortBy === 'style') return primaryStyle(a).localeCompare(primaryStyle(b)) || a.name.localeCompare(b.name);
    if (sortBy === 'color') return primaryColor(a).localeCompare(primaryColor(b)) || a.name.localeCompare(b.name);
    if (sortBy === 'status') return getRecord(a).status.localeCompare(getRecord(b).status) || a.name.localeCompare(b.name);
    return a.family.localeCompare(b.family) || a.name.localeCompare(b.name);
  });
}

function filterThemes() {
  const query = searchEl.value.trim().toLowerCase();
  const family = familyFilterEl.value;
  const mood = moodFilterEl.value;
  const status = statusFilterEl.value;
  return THEME_DATA.filter(theme => {
    const record = getRecord(theme);
    const haystack = [
      theme.name,
      theme.description,
      theme.family,
      ...theme.tags,
      ...theme.bestFor,
      record.note || ''
    ].join(' ').toLowerCase();
    if (query && !haystack.includes(query)) return false;
    if (family && theme.family !== family) return false;
    if (mood && !theme.tags.includes(mood)) return false;
    if (status && record.status !== status) return false;
    if (shortlistOnly && record.status !== 'shortlist') return false;
    return true;
  });
}

function renderSummary(visible) {
  const shortlistCount = THEME_DATA.filter(theme => getRecord(theme).status === 'shortlist').length;
  const maybeCount = THEME_DATA.filter(theme => getRecord(theme).status === 'maybe').length;
  const archiveCount = THEME_DATA.filter(theme => getRecord(theme).status === 'archive').length;
  const compareCount = getCompareThemes().length;
  summaryEl.innerHTML = `
    <div class="stat"><strong>${visible.length}</strong> visible</div>
    <div class="stat"><strong>${THEME_DATA.length}</strong> total themes</div>
    <div class="stat"><strong>${shortlistCount}</strong> shortlisted</div>
    <div class="stat"><strong>${maybeCount}</strong> maybe</div>
    <div class="stat"><strong>${archiveCount}</strong> archived</div>
    <div class="stat"><strong>${compareCount}</strong> in compare</div>
  `;
}

function renderJumpNav(themes) {
  const families = [...new Set(themes.map(theme => theme.family))];
  jumpNavEl.innerHTML = families.map(family => `
    <a href="#family-${slugify(family)}">${family}</a>
  `).join('');
}

function renderWorkspace() {
  const shortlist = THEME_DATA.filter(theme => getRecord(theme).status === 'shortlist');
  workspacePanelEl.innerHTML = `
    <div class="workspace-header">
      <div>
        <h2>Shortlist Workspace</h2>
        <p>Your current finalists. Use this area as the top-of-page decision board.</p>
      </div>
      <div class="group-count">${shortlist.length}</div>
    </div>
    <div class="workspace-body">
      ${shortlist.length
        ? `<div class="workspace-cards">${shortlist.map(themeCard).join('')}</div>`
        : `<div class="workspace-empty">No shortlisted themes yet. Mark any theme as shortlist and it will surface here automatically.</div>`}
    </div>
  `;
}

function renderCompare() {
  const themes = getCompareThemes();
  if (!themes.length) {
    comparePanelEl.hidden = true;
    comparePanelEl.innerHTML = '';
    return;
  }
  const rows = [
    ['Theme', theme => `
      <div class="compare-theme">
        <div>
          <div class="code">${theme.code}</div>
          <strong>${theme.name}</strong>
        </div>
        <button type="button" data-remove-compare="${theme.id}">Remove</button>
      </div>
    `],
    ['Preview', theme => `<div class="compare-preview-cell">${previewMarkup(theme)}</div>`],
    ['Family', theme => theme.family],
    ['Description', theme => theme.description],
    ['Primary Mood', theme => primaryMood(theme) || 'n/a'],
    ['Primary Style', theme => primaryStyle(theme) || 'n/a'],
    ['Primary Color', theme => primaryColor(theme) || 'n/a'],
    ['Best For', theme => theme.bestFor.map(item => `<span class="meta-pill">${item}</span>`).join('')],
    ['Status', theme => `<span class="status-pill status-${getRecord(theme).status}">${labelize(getRecord(theme).status)}</span>`],
    ['Project', theme => escapeHtml(getRecord(theme).project || '—')],
    ['Fit', theme => escapeHtml(getRecord(theme).fit || '—')],
    ['Note', theme => escapeHtml(getRecord(theme).note || '—')]
  ];
  comparePanelEl.hidden = false;
  comparePanelEl.innerHTML = `
    <div class="compare-header">
      <div>
        <h2>Compare Tray</h2>
        <p>Side-by-side view for up to four themes. Use it to narrow a shortlist before moving to implementation.</p>
      </div>
      <div class="compare-actions">
        <button id="clearCompare" class="ghost-btn" type="button">Clear Compare</button>
      </div>
    </div>
    <div class="compare-grid">
      ${rows.map(([label, renderValue]) => `
        <div class="compare-label">${label}</div>
        ${themes.map(theme => `<div class="compare-cell">${renderValue(theme)}</div>`).join('')}
      `).join('')}
    </div>
  `;
  comparePanelEl.querySelectorAll('[data-remove-compare]').forEach(button => {
    button.addEventListener('click', () => {
      toggleCompare(button.dataset.removeCompare);
      render();
    });
  });
  comparePanelEl.querySelector('#clearCompare')?.addEventListener('click', () => {
    state.compareIds = [];
    persistState();
    render();
  });
}

function renderDetail(theme) {
  if (!theme) {
    detailEl.innerHTML = '<div class="empty">Select a theme to inspect its family, notes, status, and use-case fit.</div>';
    return;
  }
  const record = getRecord(theme);
  detailEl.innerHTML = `
    <div>
      <div class="code">${theme.code}</div>
      <h3>${theme.name}</h3>
      <p>${theme.description}</p>
    </div>
    ${previewMarkup(theme, true)}
    ${shouldShowPreviewNudge(theme) ? `
      <div class="preview-tip">
        <strong>Preview Modes</strong>
        <p>The large preview is live-editable. Start with a preset to see this theme as a project pitch, portfolio case study, or product hero before you shortlist it.</p>
        <div class="preview-tip-actions">
          <button id="previewTipPitch" type="button">Try Pitch Mode</button>
          <button id="previewTipProduct" type="button">Try Product Hero</button>
          <button id="dismissPreviewTip" type="button">Dismiss Hint</button>
        </div>
      </div>
    ` : ''}
    <div class="detail-box">
      <div class="preview-copy-head">
        <strong>Preview Copy Studio</strong>
        <span>Live text controls for the large preview</span>
      </div>
      <div class="preview-editor">
        <div class="preset-row">
          <button id="presetDefault" type="button">Theme Default</button>
          <button id="presetPitch" type="button">Project Pitch</button>
          <button id="presetPortfolio" type="button">Portfolio</button>
          <button id="presetProduct" type="button">Product Hero</button>
        </div>
        <input id="previewHeadline" type="text" placeholder="Preview headline" value="${escapeAttr(getPreviewCopy(theme).headline)}">
        <input id="previewSubtitle" type="text" placeholder="Preview subtitle" value="${escapeAttr(getPreviewCopy(theme).subtitle)}">
        <textarea id="previewBody" placeholder="Preview body copy">${escapeHtml(getPreviewCopy(theme).body)}</textarea>
        <div class="preview-editor-actions">
          <button id="resetPreviewCopy" class="ghost-btn" type="button">Reset Preview Copy</button>
        </div>
      </div>
    </div>
    <div class="swatch-row">${paletteSwatches(theme)}</div>
    <div class="mini-list">${theme.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
    <div class="detail-grid">
      <div class="detail-box">
        <label>Family</label>
        <div>${theme.family}</div>
      </div>
      <div class="detail-box">
        <label>Status</label>
        <select id="detailStatus">
          ${['unreviewed','shortlist','maybe','archive'].map(value => `<option value="${value}" ${record.status === value ? 'selected' : ''}>${labelize(value)}</option>`).join('')}
        </select>
      </div>
      <div class="detail-box">
        <label>Primary Mood</label>
        <div>${primaryMood(theme) || 'n/a'}</div>
      </div>
      <div class="detail-box">
        <label>Primary Style</label>
        <div>${primaryStyle(theme) || 'n/a'}</div>
      </div>
      <div class="detail-box detail-wide">
        <label>Project / Use Case</label>
        <input id="detailProject" class="inline-input" type="text" placeholder="Assign to project or experiment" value="${escapeAttr(record.project || '')}">
      </div>
      <div class="detail-box">
        <label>Fit</label>
        <select id="detailFit">
          ${['','strong','possible','stretch'].map(value => `<option value="${value}" ${record.fit === value ? 'selected' : ''}>${value ? labelize(value) : 'Unset'}</option>`).join('')}
        </select>
      </div>
      <div class="detail-box">
        <label>Compare</label>
        <div>${state.compareIds.includes(theme.id) ? 'In compare tray' : 'Not in compare tray'}</div>
      </div>
    </div>
    <div class="detail-box">
      <label>Best For</label>
      <div class="mini-list">${theme.bestFor.map(item => `<span class="meta-pill">${item}</span>`).join('')}</div>
    </div>
    <div class="detail-box">
      <label>Organizer Note</label>
      <textarea id="detailNote" class="notes-box" placeholder="Why use this theme? What should it map to? Risks? Comparables?">${escapeHtml(record.note || '')}</textarea>
    </div>
    <div class="detail-actions">
      <button id="detailCompare" class="ghost-btn" type="button">${state.compareIds.includes(theme.id) ? 'Remove From Compare' : 'Add To Compare'}</button>
      <button id="detailShortlist" class="ghost-btn" type="button">${record.status === 'shortlist' ? 'Unshortlist' : 'Mark Shortlist'}</button>
      <button id="detailArchive" class="ghost-btn" type="button">Archive</button>
    </div>
    <div class="footer-note">Families and organizer structure were derived from the current theme gallery plus agent review. The original visual browsing file remains unchanged.</div>
  `;
  detailEl.querySelector('#detailStatus').addEventListener('change', (event) => {
    setRecord(theme.id, { status: event.target.value });
    render();
  });
  detailEl.querySelector('#detailNote').addEventListener('input', (event) => {
    setRecord(theme.id, { note: event.target.value });
  });
  detailEl.querySelector('#previewHeadline').addEventListener('input', (event) => {
    setPreviewCopy(theme.id, { headline: event.target.value });
    render();
  });
  detailEl.querySelector('#previewSubtitle').addEventListener('input', (event) => {
    setPreviewCopy(theme.id, { subtitle: event.target.value });
    render();
  });
  detailEl.querySelector('#previewBody').addEventListener('input', (event) => {
    setPreviewCopy(theme.id, { body: event.target.value });
    render();
  });
  detailEl.querySelector('#presetDefault').addEventListener('click', () => {
    setPreviewCopy(theme.id, previewPreset(theme, record, 'default'));
    render();
  });
  detailEl.querySelector('#presetPitch').addEventListener('click', () => {
    setPreviewCopy(theme.id, previewPreset(theme, record, 'pitch'));
    render();
  });
  detailEl.querySelector('#presetPortfolio').addEventListener('click', () => {
    setPreviewCopy(theme.id, previewPreset(theme, record, 'portfolio'));
    render();
  });
  detailEl.querySelector('#presetProduct').addEventListener('click', () => {
    setPreviewCopy(theme.id, previewPreset(theme, record, 'product'));
    render();
  });
  detailEl.querySelector('#resetPreviewCopy').addEventListener('click', () => {
    resetPreviewCopy(theme.id);
    render();
  });
  detailEl.querySelector('#previewTipPitch')?.addEventListener('click', () => {
    setPreviewCopy(theme.id, previewPreset(theme, record, 'pitch'));
    render();
  });
  detailEl.querySelector('#previewTipProduct')?.addEventListener('click', () => {
    setPreviewCopy(theme.id, previewPreset(theme, record, 'product'));
    render();
  });
  detailEl.querySelector('#dismissPreviewTip')?.addEventListener('click', () => {
    state.ui.previewHintDismissed = true;
    persistState();
    render();
  });
  detailEl.querySelector('#detailProject').addEventListener('input', (event) => {
    setRecord(theme.id, { project: event.target.value });
    renderCompare();
  });
  detailEl.querySelector('#detailFit').addEventListener('change', (event) => {
    setRecord(theme.id, { fit: event.target.value });
    renderCompare();
  });
  detailEl.querySelector('#detailCompare').addEventListener('click', () => {
    toggleCompare(theme.id);
    render();
  });
  detailEl.querySelector('#detailShortlist').addEventListener('click', () => {
    setRecord(theme.id, { status: record.status === 'shortlist' ? 'unreviewed' : 'shortlist' });
    render();
  });
  detailEl.querySelector('#detailArchive').addEventListener('click', () => {
    setRecord(theme.id, { status: 'archive' });
    render();
  });
}

function labelize(value) {
  return value.replace(/_/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
}

function slugify(value) {
  return value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function escapeHtml(value) {
  return value
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll('"', '&quot;');
}

function themeCard(theme) {
  const record = getRecord(theme);
  const isActive = selectedId === theme.id;
  const statusClass = `status-${record.status}`;
  return `
    <article class="card ${isActive ? 'active' : ''}" data-theme-id="${theme.id}">
      <div class="card-top">
        <div>
          <div class="code">${theme.code}</div>
          <div class="name">${theme.name}</div>
        </div>
        <span class="status-pill ${statusClass}">${labelize(record.status)}</span>
      </div>
      <div class="desc">${theme.description}</div>
      ${previewMarkup(theme)}
      <div class="swatch-row">${paletteSwatches(theme)}</div>
      <div class="meta-row">
        <span class="meta-pill">${theme.family}</span>
        <span class="meta-pill">${primaryStyle(theme) || 'mixed'}</span>
      </div>
      <div class="tag-row">${theme.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
      ${record.note ? `<div class="desc">Note: ${escapeHtml(record.note).slice(0, 120)}</div>` : ''}
      <div class="action-row">
        <button type="button" data-action="select">${isActive ? 'Selected' : 'Inspect'}</button>
        <button type="button" data-action="shortlist" class="${record.status === 'shortlist' ? 'shortlisted' : 'secondary'}">${record.status === 'shortlist' ? 'Shortlisted' : 'Shortlist'}</button>
        <button type="button" data-action="maybe" class="secondary">Maybe</button>
        <button type="button" data-action="compare" class="secondary">${state.compareIds.includes(theme.id) ? 'In Compare' : 'Compare'}</button>
      </div>
    </article>
  `;
}

function renderCards(themes) {
  if (!themes.length) {
    groupsEl.innerHTML = '<div class="empty">No themes match this view. Try clearing a filter or switching out of shortlist mode.</div>';
    return;
  }

  if (!groupMode) {
    groupsEl.innerHTML = `<section class="group"><div class="group-header"><div><h2>All Matching Themes</h2><p>Flat list for scanning, sorting, and shortlisting.</p></div><div class="group-count">${themes.length}</div></div><div class="cards">${themes.map(themeCard).join('')}</div></section>`;
    bindCardActions();
    return;
  }

  const grouped = themes.reduce((acc, theme) => {
    (acc[theme.family] ||= []).push(theme);
    return acc;
  }, {});

  groupsEl.innerHTML = Object.entries(grouped).map(([family, familyThemes]) => `
    <section id="family-${slugify(family)}" class="group ${state.collapsedFamilies[family] ? 'collapsed' : ''} ${viewMode === 'focus' && !familyThemes.some(theme => theme.id === selectedId) ? 'focus-hidden' : ''}" data-family="${escapeAttr(family)}">
      <div class="group-header">
        <div>
          <h2>${family}</h2>
          <p>${groupDescriptions[family] || 'Theme family'}</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="group-count">${familyThemes.length}</div>
          <button type="button" class="group-toggle" data-toggle-family="${escapeAttr(family)}">${state.collapsedFamilies[family] ? '+' : '−'}</button>
        </div>
      </div>
      <div class="cards">${familyThemes.map(themeCard).join('')}</div>
    </section>
  `).join('');
  bindCardActions();
  groupsEl.querySelectorAll('[data-toggle-family]').forEach(button => {
    button.addEventListener('click', (event) => {
      event.stopPropagation();
      const family = button.dataset.toggleFamily;
      state.collapsedFamilies[family] = !state.collapsedFamilies[family];
      persistState();
      render();
    });
  });
}

function bindCardActions() {
  groupsEl.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.themeId;
    const theme = THEME_DATA.find(item => item.id === id);
    card.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'shortlist') {
        const current = getRecord(theme).status;
        setRecord(id, { status: current === 'shortlist' ? 'unreviewed' : 'shortlist' });
        render();
        return;
      }
      if (action === 'maybe') {
        setRecord(id, { status: 'maybe' });
        render();
        return;
      }
      if (action === 'compare') {
        toggleCompare(id);
        render();
        return;
      }
      selectedId = id;
      state.selectedId = id;
      persistState();
      render();
    });
  });
}

function render() {
  const visible = sortThemes(filterThemes());
  const selected = THEME_DATA.find(theme => theme.id === selectedId) || visible[0] || THEME_DATA.find(theme => theme.id === 't27') || THEME_DATA[0];
  if (selected) selectedId = selected.id;
  state.selectedId = selectedId;
  persistState();
  renderSummary(visible);
  renderJumpNav(visible);
  renderWorkspace();
  renderCompare();
  renderCards(visible);
  renderDetail(selected);
  groupToggleEl.textContent = groupMode ? 'Grouped' : 'Flat List';
  shortlistToggleEl.textContent = shortlistOnly ? 'Shortlist Only' : 'All Themes';
  viewModeToggleEl.textContent = viewMode === 'selection' ? 'Selection Mode' : viewMode === 'gallery' ? 'Gallery Mode' : 'Focus Mode';
}

function exportState() {
  const payload = {
    exportedAt: new Date().toISOString(),
    compareIds: state.compareIds,
    selectedId,
    themes: THEME_DATA.map(theme => ({
      id: theme.id,
      name: theme.name,
      family: theme.family,
      tags: theme.tags,
      bestFor: theme.bestFor,
      ...getRecord(theme)
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'theme-organizer-state.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

async function copyShortlist() {
  const shortlist = THEME_DATA
    .filter(theme => getRecord(theme).status === 'shortlist')
    .map(theme => {
      const record = getRecord(theme);
      return [
        `${theme.name} (${theme.code})`,
        `Family: ${theme.family}`,
        `Best for: ${theme.bestFor.join(', ')}`,
        record.project ? `Project: ${record.project}` : '',
        record.fit ? `Fit: ${record.fit}` : '',
        record.note ? `Note: ${record.note}` : ''
      ].filter(Boolean).join('\n');
    })
    .join('\n\n');
  const text = shortlist || 'No shortlisted themes yet.';
  try {
    await navigator.clipboard.writeText(text);
    copyShortlistEl.textContent = 'Copied';
    setTimeout(() => { copyShortlistEl.textContent = 'Copy Shortlist'; }, 1200);
  } catch {
    window.prompt('Copy shortlist text', text);
  }
}

function importState(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const importedThemes = Array.isArray(parsed) ? parsed : parsed.themes;
      if (!Array.isArray(importedThemes)) throw new Error('Invalid shape');
      importedThemes.forEach(item => {
        if (!item?.id) return;
        setRecord(item.id, {
          status: item.status || 'unreviewed',
          note: item.note || '',
          project: item.project || '',
          fit: item.fit || ''
        });
      });
      state.compareIds = Array.isArray(parsed.compareIds) ? parsed.compareIds.slice(0,4) : state.compareIds;
      if (parsed.selectedId) selectedId = parsed.selectedId;
      persistState();
      render();
    } catch {
      window.alert('Could not import organizer JSON.');
    }
  };
  reader.readAsText(file);
}

function clearFilters() {
  searchEl.value = '';
  familyFilterEl.value = '';
  moodFilterEl.value = '';
  statusFilterEl.value = '';
  sortByEl.value = 'family';
  shortlistOnly = false;
  persistState();
  render();
}

function resetView() {
  groupMode = true;
  viewMode = 'selection';
  shortlistOnly = false;
  state.collapsedFamilies = buildCollapsedFamilies(selectedId);
  persistState();
  render();
}

searchEl.addEventListener('input', render);
familyFilterEl.addEventListener('change', render);
moodFilterEl.addEventListener('change', render);
statusFilterEl.addEventListener('change', render);
sortByEl.addEventListener('change', render);
groupToggleEl.addEventListener('click', () => { groupMode = !groupMode; render(); });
shortlistToggleEl.addEventListener('click', () => { shortlistOnly = !shortlistOnly; render(); });
viewModeToggleEl.addEventListener('click', () => {
  viewMode = viewMode === 'selection' ? 'gallery' : viewMode === 'gallery' ? 'focus' : 'selection';
  render();
});
exportStateEl.addEventListener('click', exportState);
copyShortlistEl.addEventListener('click', copyShortlist);
importStateEl.addEventListener('click', () => importFileEl.click());
importFileEl.addEventListener('change', (event) => {
  const file = event.target.files?.[0];
  if (file) importState(file);
  event.target.value = '';
});
clearFiltersEl.addEventListener('click', clearFilters);
resetViewEl.addEventListener('click', resetView);

if (!Object.keys(state.collapsedFamilies).length) {
  state.collapsedFamilies = buildCollapsedFamilies(selectedId);
}

render();
</script>
</body>
</html>
